<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Department of Microbiology, Jinnah University for Women">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6E7C1"/>
      <stop offset="0.5" stop-color="#C4A45A"/>
      <stop offset="1" stop-color="#7A5720"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.32" cy="0.28" r="0.78">
      <stop offset="0" stop-color="#F7FCFE"/>
      <stop offset="0.45" stop-color="#7FB6C8"/>
      <stop offset="1" stop-color="#1D4D9C"/>
    </radialGradient>
    <path id="topArc" d="M 30,128 A 98,98 0 0 1 226,128"/>
    <path id="botArc" d="M 226,128 A 98,98 0 0 1 30,128"/>
