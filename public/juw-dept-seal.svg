  <circle cx="128" cy="128" r="127" fill="#0B1520"/>
  <circle cx="128" cy="128" r="121" fill="none" stroke="url(#gold)" stroke-width="7"/>
  <circle cx="128" cy="128" r="112" fill="none" stroke="#F4EFE4" stroke-width="1.15" opacity="0.55"/>
  <circle cx="128" cy="128" r="96" fill="#F4EFE4"/>
  <circle cx="128" cy="128" r="96" fill="none" stroke="#C4A45A" stroke-width="1.5"/>
