    <path d="M38 76 H50"/>
    <path d="M38 66 C30 66 26 58 26 50 V34 H62 V50 C62 58 58 66 50 66 Z"/>
    <path d="M50 34 V18 H38 V34"/>
  </g>
  <circle cx="128" cy="104" r="9" fill="url(#gold)"/>
  <circle cx="128" cy="104" r="6.2" fill="url(#glass)"/>
  <circle cx="126.4" cy="102.4" r="1.8" fill="#F7FCFE"/>
