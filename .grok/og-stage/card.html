<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Source Serif 4";
      src: url("../og-fonts/source-serif-latin.woff2") format("woff2");
      font-weight: 500 700;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Figtree";
      src: url("../og-fonts/figtree-latin.woff2") format("woff2");
      font-weight: 400 600;
      font-style: normal;
      font-display: block;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0B1520;
    }
    body {
      background:
        radial-gradient(ellipse 70% 62% at 50% 42%, #132536 0%, #0B1520 74%);
    }
    .bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 8px;
      display: flex;
    }
    .bar span:first-child { flex: 1; background: #1D4D9C; }
    .bar span:last-child { flex: 1; background: #0C7A3A; }
    .stage {
      width: 1200px;
      height: 630px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 72px 36px;
    }
    .lockup {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .seal {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #F4EFE4;
      box-shadow: 0 0 0 3px #F4EFE4, 0 0 0 5px #4E8EA8;
      overflow: hidden;
      flex-shrink: 0;
    }
    .seal img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .word {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .title {
      font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
      font-weight: 600;
      font-size: 52px;
      line-height: 0.95;
      letter-spacing: -0.028em;
      color: #F4EFE4;
      white-space: nowrap;
    }
    .subtitle {
      font-family: "Figtree", ui-sans-serif, system-ui, sans-serif;
      font-weight: 500;
      font-size: 18px;
      line-height: 1.15;
      letter-spacing: 0.02em;
      color: #4E8EA8;
      white-space: nowrap;
    }
    .slide-wrap {
      margin-top: 26px;
      width: 744px;
      background: #954A33;
      padding: 4px;
      box-shadow:
        0 28px 56px rgba(0, 0, 0, 0.46),
        0 0 0 1px rgba(244, 239, 228, 0.08);
    }
    .slide-band {
      background: #C8DBE1;
      padding: 8px;
    }
    .slide {
      background: #FFFFFF;
      border: 4px solid #954A33;
      height: 382px;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .marks {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 14px 16px 0;
    }
    .marks img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      display: block;
      background: #fff;
    }
    .slide-title {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 48px 8px;
      font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
      font-weight: 600;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-align: center;
      color: #1A2433;
    }
    .meta {
      align-self: flex-end;
      text-align: right;
      padding: 0 22px 16px;
      font-family: "Figtree", ui-sans-serif, system-ui, sans-serif;
      font-weight: 500;
      font-size: 9px;
      line-height: 1.45;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #1A2433;
    }
    .meta .rule {
      width: 36px;
      height: 3px;
      background: #4E8EA8;
      margin: 0 0 8px auto;
    }
  </style>
</head>
<body>
  <div class="bar" aria-hidden="true"><span></span><span></span></div>
  <div class="stage">
    <div class="lockup">
      <div class="seal">
        <img src="file:///workspace/public/juw-crest.jpg" alt="" />
      </div>
      <div class="word">
        <div class="title">JUW-MicroSlides</div>
        <div class="subtitle">v6.2.1 — evidence-based lecture decks</div>
      </div>
    </div>
    <div class="slide-wrap">
      <div class="slide-band">
        <div class="slide">
          <div class="marks">
            <img src="file:///workspace/public/juw-crest.jpg" alt="" />
            <img src="file:///workspace/public/juw-dept-seal.svg" alt="" />
          </div>
          <div class="slide-title">Microbial Enzyme<br/>Technology</div>
          <div class="meta">
            <div class="rule"></div>
            Microbial Enzyme Technology<br/>
            MIC-4511<br/>
            Prepared by: Ms. Noor<br/>
            Department of Microbiology
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
