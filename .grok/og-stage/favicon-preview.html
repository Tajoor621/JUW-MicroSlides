<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  * { margin: 0; padding: 0; }
  html, body { background: #555; }
  body { display: flex; gap: 28px; padding: 20px; align-items: end; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; color: #fff; font: 11px/1 sans-serif; }
  img { image-rendering: pixelated; display: block; }
  .on-light { background: #f4efe4; }
  .on-dark { background: #0B1520; }
  .x16 { width: 16px; height: 16px; }
  .x32 { width: 32px; height: 32px; }
  .x64 { width: 64px; height: 64px; }
</style>
</head>
<body>
  <div class="cell"><img class="x16 on-light" src="file:///workspace/.grok/favicon.svg.tmp"/><span>16 light</span></div>
  <div class="cell"><img class="x16 on-dark" src="file:///workspace/.grok/favicon.svg.tmp"/><span>16 dark</span></div>
  <div class="cell"><img class="x32 on-light" src="file:///workspace/.grok/favicon.svg.tmp"/><span>32</span></div>
  <div class="cell"><img class="x64 on-light" src="file:///workspace/.grok/favicon.svg.tmp"/><span>64</span></div>
</body>
</html>
