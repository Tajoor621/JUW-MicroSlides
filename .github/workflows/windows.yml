name: Windows desktop build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm run test:version-lock
      - run: node --test scripts/pptx-fonts.test.mjs
      - run: npm run typecheck
      - run: npm run test:scientific
      - run: npm run test:professional
      - run: npm run test:audit
      - run: npm run test:lecture
      - run: npm run test:teaching
      - run: npm run test:release
      - run: npm run test:lecturer
      - run: cargo metadata --locked --format-version 1 --no-deps --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:build
      - name: Install the NSIS package and its WebView2 dependency
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $installed = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Installer failed: $($installed.ExitCode)" }
      - run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml
      # WebView2 150+ ignores CDP env settings on elevated hosts (wry#1782).
      # Exercise the unchanged release binary with an ordinary lecturer's token.
      - name: Native UI test as a standard user
        shell: pwsh
        run: |
          winget install gerardog.gsudo --accept-source-agreements --accept-package-agreements --disable-interactivity
          $env:PATH = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          New-Item -ItemType Directory desktop-qa -Force | Out-Null
          icacls desktop-qa /grant "$($env:USERNAME):(OI)(CI)F"
          gsudo --integrity Medium node scripts/qa-desktop.mjs
          exit $LASTEXITCODE
      - name: Record artifact provenance
        shell: pwsh
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
          $provenance = @{
            commit = '${{ github.sha }}'
            appVersion = 'V6.2.1'
            rust = (rustc --version)
            node = (node --version)
            npm = (npm --version)
            cargoLockSha256 = (Get-FileHash src-tauri/Cargo.lock -Algorithm SHA256).Hash
            npmLockSha256 = (Get-FileHash package-lock.json -Algorithm SHA256).Hash
            installers = @($files | ForEach-Object { @{ name = $_.Name; sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash; signature = (Get-AuthenticodeSignature $_.FullName).Status.ToString() } })
            physicalClassroomQualified = $false
            independentlyScientificallyQualified = $false
          }
          $provenance | ConvertTo-Json -Depth 5 | Set-Content desktop-qa/artifact-provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Windows-native-QA
          path: desktop-qa/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: JUW-MicroSlides-V6.2.1-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
