name: Windows desktop build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm run typecheck
      - run: npm run test:professional
      - run: npm run desktop:build
      - name: Install the NSIS package and its WebView2 dependency
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $installed = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Installer failed: $($installed.ExitCode)" }
      - run: cargo test --release --manifest-path src-tauri/Cargo.toml
      - run: node scripts/qa-desktop.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-native-QA
          path: desktop-qa/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JUW-MicroSlides-V6.2.1-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
