name: Verify and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:research
      - run: npm run test:topics
      - run: npm run test:generation
      - run: npm run test:scientific
      - run: npm run test:professional
      - run: npm run test:lecturer
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:pages
        env:
          JUW_QA_OUTPUT: ${{ runner.temp }}/juw-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-contract-results
          path: qualification-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-export-qualification
          path: ${{ runner.temp }}/juw-qa/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

  smoke-live:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify public URL serves interactive editor, not a landing page
        run: node scripts/check-live-pages.mjs
