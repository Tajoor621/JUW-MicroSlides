name: Verify and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"
  build:
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:version-lock
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:uk-english
      - run: npm test
      - run: npm run test:research
      - run: npm run test:topics
      - run: npm run test:generation
      - run: npm run test:scientific
      - run: npm run test:professional
      - run: npm run test:audit
      - run: npm run test:lecture
      - run: npm run test:teaching
      - run: npm run test:release
      - run: npm run test:lecturer
      - run: npm run build:pages
      - name: Use the hosted runner's installed Chrome
        run: |
          JUW_BROWSER_PATH="${CHROME_BIN:-$(command -v google-chrome)}"
          test -x "$JUW_BROWSER_PATH"
          "$JUW_BROWSER_PATH" --version
          echo "JUW_CHROMIUM=$JUW_BROWSER_PATH" >> "$GITHUB_ENV"
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run qa:notes
        env:
          JUW_QA_OUTPUT: ${{ runner.temp }}/juw-qa
      - run: npm run qa:reviewed-export
        env:
          JUW_QA_OUTPUT: ${{ runner.temp }}/juw-qa
      - run: npm run qa:pages
        env:
          JUW_QA_OUTPUT: ${{ runner.temp }}/juw-qa
      - run: npm run qa:lecture
        env:
          JUW_QA_OUTPUT: ${{ runner.temp }}/juw-qa
      - run: npm run qa:topic-recovery
        env:
          JUW_QA_OUTPUT: ${{ runner.temp }}/juw-qa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scientific-contract-results
          path: qualification-results/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-export-qualification
          path: ${{ runner.temp }}/juw-qa/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist-pages
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment

  smoke-live:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify public URL serves interactive editor, not a landing page
        run: node scripts/check-live-pages.mjs
