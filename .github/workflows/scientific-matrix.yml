name: Scientific topic and count matrix
on:
  workflow_dispatch:
    inputs:
      start:
        description: First topic index (0–199)
        default: "0"
        required: true
      limit:
        description: Topics (1–200); 200 with all counts schedules 10000 live requests
        default: "3"
        required: true
      counts:
        description: all (1–50), manifest, or comma-separated integers
        default: "1,25,50"
        required: true
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      topics: ${{ steps.plan.outputs.topics }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: plan
        env:
          JUW_BENCH_START: ${{ inputs.start }}
          JUW_BENCH_LIMIT: ${{ inputs.limit }}
          JUW_BENCH_COUNTS: ${{ inputs.counts }}
        run: |
          node --input-type=module <<'JS'
          import { benchmarkPlan } from './scripts/benchmark-plan.mjs';
          import { readFileSync, appendFileSync } from 'node:fs';
          const cases = JSON.parse(readFileSync('benchmarks/microbiology-topics.json')).cases;
          const plan = benchmarkPlan(cases);
          const ids = [...new Set(plan.jobs.map(j => j.caseId))];
          const topics = ids.map(id => cases.findIndex(c => c.id === id));
          appendFileSync(process.env.GITHUB_OUTPUT, `topics=${JSON.stringify(topics)}\n`);
          JS
  live:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        topic: ${{ fromJSON(needs.plan.outputs.topics) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run benchmark:live
        env:
          JUW_BENCH_START: ${{ matrix.topic }}
          JUW_BENCH_LIMIT: "1"
          JUW_BENCH_COUNTS: ${{ inputs.counts }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-topic-${{ matrix.topic }}
          path: qualification-results/live/
