name: Actual PowerPoint qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  licensed-powerpoint:
    # A logged-on, disposable Windows lab machine with licensed desktop PowerPoint is required.
    # GitHub-hosted Windows does not provide this; never report a substitute renderer as PowerPoint.
    runs-on: [self-hosted, Windows, juw-powerpoint]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build:pages
      - run: npx playwright install chromium
      - run: npm run qa:pages
        env:
          JUW_QA_OUTPUT: qualification-results/powerpoint
          JUW_QUALIFY_PPTX: "1"
      - run: pwsh -File scripts/qualify-powerpoint.ps1
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/compare-powerpoint.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: actual-powerpoint-qualification
          path: qualification-results/powerpoint/
