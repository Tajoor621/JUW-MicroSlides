name: Actual PowerPoint qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  licensed-powerpoint:
    # A logged-on, disposable Windows lab machine with licensed desktop PowerPoint is required.
    # GitHub-hosted Windows does not provide this; never report a substitute renderer as PowerPoint.
    runs-on: [self-hosted, Windows, juw-powerpoint]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build:pages
      - run: npx playwright install chromium
      - run: npm run qa:pages
        env:
          JUW_QA_OUTPUT: qualification-results/powerpoint
          JUW_QUALIFY_PPTX: "1"
      - run: pwsh -File scripts/qualify-powerpoint.ps1
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/compare-powerpoint.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: actual-powerpoint-qualification
          path: qualification-results/powerpoint/
