name: Live scientific source benchmark
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First topic index (0–199)"
        default: "0"
        required: true
      limit:
        description: "Number of real topics (1–200); no fixtures"
        default: "3"
        required: true
      counts:
        description: "manifest, all (1–50), or comma-separated counts; all is expensive"
        default: "manifest"
        required: true
permissions:
  contents: read
jobs:
  live-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run benchmark:live
        env:
          JUW_BENCH_START: ${{ inputs.start }}
          JUW_BENCH_LIMIT: ${{ inputs.limit }}
          JUW_BENCH_COUNTS: ${{ inputs.counts }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: live-source-benchmark-${{ inputs.start }}
          path: qualification-results/live/
