name: Windows startup diagnostic
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing Windows build run in this repository
        required: true
        type: string
      artifact_id:
        description: Installer artifact from that run
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: startup-installer
      - shell: pwsh
        run: |
          $installer = Get-ChildItem startup-installer -Filter *.exe -Recurse | Select-Object -First 1
          $installed = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Installer failed: $($installed.ExitCode)" }
          & 7z x $installer.FullName -ostartup-extracted -y | Out-Null
          Get-ChildItem startup-extracted -Recurse | Select-Object FullName, Length
          $appExe = Get-ChildItem startup-extracted -Filter *.exe -Recurse | Where-Object { $_.Name -match 'microslides' } | Select-Object -First 1
          if (-not $appExe) { throw 'Application binary missing from extracted installer' }
          New-Item -ItemType Directory src-tauri/target/release -Force | Out-Null
          Copy-Item $appExe.FullName src-tauri/target/release/juw-microslides.exe
      # WebView2 150+ ignores CDP env settings on elevated hosts (wry#1782).
      # Exercise the unchanged release binary with an ordinary lecturer's token.
      - name: Native UI test as a standard user
        shell: pwsh
        run: |
          winget install gerardog.gsudo --accept-source-agreements --accept-package-agreements --disable-interactivity
          $env:PATH = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          New-Item -ItemType Directory desktop-qa -Force | Out-Null
          icacls desktop-qa /grant "$($env:USERNAME):(OI)(CI)F"
          gsudo --integrity Medium node scripts/qa-desktop.mjs
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Windows-startup-diagnostics
          path: desktop-qa/
